services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: olftransfer
      BASE_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8000
      APP_SECRET: ${APP_SECRET}
      MAX_ZIP_SIZE_BYTES: ${MAX_ZIP_SIZE_BYTES:-1073741824}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.bxota.test}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-olftransfer}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://olf-transfer.bxota.test/auth/oidc/callback}
      OIDC_BACKCHANNEL_URL: ${OIDC_BACKCHANNEL_URL:-http://host.docker.internal:8080}
      CLASSE_API_KEY: ${CLASSE_API_KEY:-classe-local-development-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: []
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app/src:/app/src
      - ./infra/roles/postgres/files/schema.sql:/app/schema.sql:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_TARGET: http://app:8000
      DEV_PUBLIC_HOST: olf-transfer.bxota.test
    command: sh -c "npm install && npm run dev"
    networks:
      - internal
      - devnet
    depends_on:
      - app

  postgres:
    environment:
      POSTGRES_DB: olftransfer
      POSTGRES_USER: olftransfer
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/roles/postgres/files/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olftransfer -d olftransfer"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: olftransfer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - internal
      - devnet

  createbuckets:
    image: minio/mc
    networks:
      - internal
      - devnet
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/olftransfer;
      mc anonymous set download local/olftransfer;
      exit 0;
      "

volumes:
  miniodata:
  frontend_node_modules:

networks:
  devnet:
    driver: bridge
  caddy_net:
    driver: bridge
